name = "waitwhat"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Create it with:  npx wrangler kv namespace create DECKS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "DECKS"
id = "REPLACE_WITH_KV_ID"

# 3 uploads per minute per IP
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
